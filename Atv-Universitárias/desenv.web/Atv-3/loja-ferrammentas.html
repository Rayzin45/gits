<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Ferramentas</title>
    <link rel="stylesheet" href="estilo-loja.css">
</head>
<body>
    <header>
        <h1>Bem-vindo à Loja de Ferramentas</h1>
        <p>Produtos disponíveis: </p>
    </header>

    <main class="produtos">

        <div class="card">

            <h3>Martelo</h3>
            <p>Ótimo para trabalhos de construção</p>
            <span class="preco">Preço: R$ 50,00</span>
            <button>"Comprar"</button> 
        </div>

    </main>

    <main class="produtos">

        <div class="card">

            <h3>Chave de Fenda</h3>
            <p>Perfeita para ajustes e manutenção</p>
            <span class="preco">Preço: R$ 25,00</span>
            <button>"Comprar"</button>
        </div>
    

    </main>

    <main class="produtos">

        <div class="card">

            <h3>Parafusos</h3>
            <p>Temos de vários tamanhos</p>
            <span class="preco">Preço: R$ 2,00</span>
            <button>"Comprar"</button>
            
        </div>

</body>
</html>
